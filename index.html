<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador SQL - Cementerio AzerothCore</title>
<style>
:root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --gold: #d4a017; --gold-light: #f0c040;
    --text: #c9d1d9; --text-dim: #8b949e;
    --success: #3fb950; --danger: #f85149; --warn: #f0a020;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.6; padding: 20px;
}
header {
    text-align: center; padding: 30px 20px; margin: 0 auto 20px auto;
    border-bottom: 2px solid var(--gold);
    background: linear-gradient(180deg, rgba(212,160,23,0.1), transparent);
    border-radius: 8px { 8px 0 0; max-width: 950 colorpx;
}
header h1 { color: var(--:gold-light); font-size: 1.8em var; text-shadow: 0 0 (--20px rgba(212,160,23,0.4); }
header p  { color: var(--text-dim); margin-top: 8px; font-size: 0.9em; }
main { max-width: 950px; margin: 0 auto; display: grid; gap: 20px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
.card h2 {
    color: var(--gold); font-size: 1.1em;
    margin-bottom: 15px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
}

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 0.85em; color: var(--text-dim); margin-bottom: 4px; }
.field label stronggold-light); }
.field input, .field select {
    width: 100%; padding: 8px 10px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); font-family: inherit; font-size: 0.9em;
}
.field input:focus, .field select:focus {
    outline: none; border-color: var(--gold);
    box-shadow: 0 0 0 2px rgba(212,160,23,0.2);
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 640px) {
    .row, .row-3 { grid-template-columns: 1fr; }
}

.hint { font-size: 0.78em; color: var(--warn); margin-top: 8px; font-style: italic; }

.btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
.btn {
    padding: 10px 18px; background: var(--gold); color: #000;
    border: none; border-radius: 4px; cursor: pointer;
    font-weight: 600; font-size: 0.95em; transition: all 0.15s;
}
.btn:hover { background: var(--gold-light); transform: translateY(-1px); }
.btn.exec { background: var(--success); color: #fff; }
.btn.exec:hover { background: #4ac95a; }
.btn.del  { background: var(--danger); color: #fff; }
.btn.del:hover { background: #ff6b62; }
.btn.copy { background: var(--border); color: var(--text); }
.btn.copy:hover { background: #484f58; }
.btn.copied { background: var(--success) !important; color: #fff !important; }

pre#output {
    background: #010409; border: 1px solid var(--border); border-radius: 4px;
    padding: 15px; font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.85em; white-space: pre-wrap; word-break: break-word;
    color: #79c0ff; line-height: 1.5; min-height: 120px;
}
</style>
</head>
<body>

<header>
    <h1>⚰️ Generador SQL - Cementerio</h1>
    <p><code>game_graveyard</code> + <code>graveyard_zone</code> · AzerothCore WotLK</p>
</header>

<main>

    <section class="card">
        <h2>1. Punto físico (<code>game_graveyard</code>)</h2>
        <div class="row">
            <div class="field"><label><strong>Graveyard ID</strong></label><input type="number" id="gy_id" value="900"></div>
            <div class="field"><label><strong>Map ID</strong></label><input type="number" id="gy_map" value="900"></div>
        </div>
        <div class="row-3">
            <div class="field"><label>X</label><input type="text" id="gy_x" value="0.0"></div>
            <div class="field"><label>Y</label><input type="text" id="gy_y" value="0.0"></div>
            <div class="field"><label>Z</label><input type="text" id="gy_z" value="0.0"></div>
        </div>
        <div class="field"><label>Comment</label><input type="text" id="gy_comment" value="Cementerio Mapa Custom"></div>

        <h2 style="margin-top:20px;">2. Enlace con la zona (<code>graveyard_zone</code>)</h2>
        <div class="row">
            <div class="field"><label><strong>GhostZone</strong> (Area ID)</label><input type="number" id="gyz_zone" value="900"></div>
            <div class="field">
                <label>Facción</label>
                <select id="gyz_faction">
                    <option value="0">0 - Ambas</option>
                    <option value="469">469 - Alianza</option>
                    <option value="67">67 - Horda</option>
                </select>
            </div>
        </div>
        <div class="field"><label>Comment</label><input type="text" id="gyz_comment" value="Zona Mapa Custom"></div>

        <p class="hint">⚠️ El Graveyard ID debe existir en WorldSafeLocs.dbc y el GhostZone en AreaTable.dbc.</p>

        <div class="btn-group">
            <button class="btn exec" onclick="buildInsert()">⚡ Generar SQL para Añadir</button>
            <button class="btn del" onclick="buildDelete()">🗑️ SQL para Borrar (si me equivoqué)</button>
        </div>
    </section>

    <section class="card">
        <h2>📜 SQL Generado</h2>
        <pre id="output">— Pulsa un botón para generar el SQL —</pre>
        <div class="btn-group">
            <button class="btn copy" onclick="copySQL(event)">📋 Copiar SQL</button>
        </div>
    </section>

</main>

<script>
const esc = s => "'" + String(s ?? '').replace(/'/g, "''") + "'";
const int = (v, def = 0) => {
    if (v === '' || v == null) return def;
    const n = parseInt(String(v).trim(), 10);
    return isNaN(n) ? def : n;
};
const num = (v, def = 0) => {
    if (v === '' || v == null) return def;
    const n = parseFloat(String(v).trim().replace(',', '.'));
    return isNaN(n) ? def : n;
};
const val = id => document.getElementById(id).value;

function buildInsert() {
    const gyId = int(val('gy_id'));
    const gyMap = int(val('gy_map'));
    const gyX = num(val('gy_x'));
    const gyY = num(val('gy_y'));
    const gyZ = num(val('gy_z'));
    const gzZone = int(val('gyz_zone'));
    const gzFaction = int(val('gyz_faction'));

    const out = [];
    out.push('USE `acore_world`;');
    out.push('');
    out.push('-- 1. Punto físico del cementerio');
    out.push('DELETE FROM `game_graveyard` WHERE `ID` = ' + gyId + ';');
    out.push('INSERT INTO `game_graveyard` (`ID`, `Map`, `x`, `y`, `z`, `Comment`) VALUES');
    out.push('(' + gyId + ', ' + gyMap + ', ' + gyX + ', ' + gyY + ', ' + gyZ + ', ' + esc(val('gy_comment')) + ');');
    out.push('');
    out.push('-- 2. Enlace con la zona');
    out.push('DELETE FROM `graveyard_zone` WHERE `ID` = ' + gyId + ' AND `GhostZone` = ' + gzZone + ';');
    out.push('INSERT INTO `graveyard_zone` (`ID`, `GhostZone`, `Faction`, `Comment`) VALUES');
    out.push('(' + gyId + ', ' + gzZone + ', ' + gzFaction + ', ' + esc(val('gyz_comment')) + ');');

    document.getElementById('output').textContent = out.join('\n');
}

function buildDelete() {
    const gyId = int(val('gy_id'));

    const out = [];
    out.push('USE `acore_world`;');
    out.push('');
    out.push('-- Eliminar cementerio con ID ' + gyId);
    out.push('DELETE FROM `game_graveyard` WHERE `ID` = ' + gyId + ';');
    out.push('DELETE FROM `graveyard_zone` WHERE `ID` = ' + gyId + ';');

    document.getElementById('output').textContent = out.join('\n');
}

function copySQL(ev) {
    const text = document.getElementById('output').textContent;
    navigator.clipboard.writeText(text).then(() => {
        const btn = ev.target;
        const orig = btn.textContent;
        btn.textContent = '✅ Copiado';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
    });
}
</script>

</body>
</html>
